name: iOS Preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preflight:
    name: Build, Test, Archive
    # Momento targets iOS 26.0, which needs Xcode 26 or newer. Older runner
    # images (macos-15 and earlier) ship Xcode 16 and cannot build this project.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Verify iOS SDK Supports Deployment Target
        run: |
          set -euo pipefail
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          sdk_major="${sdk_version%%.*}"
          echo "iOS SDK: ${sdk_version}"
          if (( sdk_major < 26 )); then
            echo "::error::iOS SDK ${sdk_version} cannot build a project targeting iOS 26.0."
            echo "::error::Use a runner image with Xcode 26 or newer."
            exit 1
          fi

      - name: Validate App Store Metadata
        run: ./scripts/validate_app_store_metadata.sh

      - name: Resolve Test Destinations
        id: destination
        run: |
          set -euo pipefail
          iphone="$(./scripts/resolve_test_destination.sh)"
          ipad="$(DEVICE_FAMILY=ipad ./scripts/resolve_test_destination.sh)"
          echo "iphone=${iphone}" >> "$GITHUB_OUTPUT"
          echo "ipad=${ipad}" >> "$GITHUB_OUTPUT"
          echo "iPhone destination: ${iphone}"
          echo "iPad destination: ${ipad}"

      - name: Release Smoke Test
        env:
          TEST_DESTINATION: ${{ steps.destination.outputs.iphone }}
          TEST_DESTINATION_IPAD: ${{ steps.destination.outputs.ipad }}
          # Hosted runners have no provisioning profile for marcshaw.MOMENTO, so
          # the device builds and the archive are produced unsigned. Signing is
          # verified on a developer machine via scripts/export_appstore_archive.sh.
          CODE_SIGNING: "0"
        run: ./scripts/release_smoke_test.sh

      - name: Verify Archive Metadata
        run: ./scripts/verify_archive_metadata.sh /tmp/MomentoRelease.xcarchive

      - name: Upload Smoke Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs
          path: build/release-smoke
          if-no-files-found: ignore
